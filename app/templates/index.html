<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume editor</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/editor.js" defer></script>
  <script src="/static/rulers.js" defer></script>
</head>
<body>
<main class="document-workspace" aria-label="Resume document">
  <div class="ruler-corner" aria-hidden="true"><svg viewBox="0 0 26 26" width="26" height="26" fill="none"><path d="M9 8v10h9" stroke="currentColor" stroke-width="3"/></svg></div>
  <div class="ruler horizontal-ruler" aria-hidden="true"></div>
  <div class="ruler vertical-ruler" aria-hidden="true"></div>
  <div class="document-page">
    <p id="error" role="alert" hidden></p>
    {% include '_editor.html' %}
  </div>
</main>
</body>
</html>
